<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Questão 4</title>
    <style>
        [title] {
            border: 4px solid red;
        }

        [title='Página 3'] {
            color: green;
        }

        [title~='K19'] {
            padding: 10px;
            background: yellow;
        }

        [title^='Link'] {
            margin-right: 30px;
        }

        [href$='link'] {
            outline: 4px solid blue;
        }

        [src*='large'] {
            border: 4px solid green;
        }

        [href|='#link'] {
            font-size: 30px;
        }

    </style>
</head>
<body>
    <a href="" title>Este é um link</a><hr>
    <a href="" title="Página 3">Este é um link verde</a><hr>
    <a href="" title="K19">Este é o link para K19</a><hr>
    <a href="" title="Link">Este é o link com margem</a><hr>
    <a href="A link">Este é o link com outline</a><hr>
    <a href="" src="large">Este link tem borda verde</a><hr>
    <a href="#link-doido">Este link é grande</a><hr>
    

</body>
</html>
