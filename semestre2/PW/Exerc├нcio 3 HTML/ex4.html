<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form action="">
        <fieldset>
            <legend>Identificação do Usuário</legend>
            <label for="user">Nome*:</label>
            <input type="text" required id="user">
            <br>
            <label for="password">Senha*:</label>
            <input type="password" required id="password">
            <br>
            <p>
                Sexo*:
                <label for="masc"><input type="radio" value="Masculino" name="gender" id="masc">Masculino</label>
                <label for="fem"><input type="radio" value="Feminino" name="gender" id="fem">Feminino</label>
            </p>
            <label for="birthdate">Data Nascimento*:</label>
            <input type="date" required id="birthdate">
            <br>
            <label for="civil-state">Estado Civil*:</label>
            <select name="" id="civil-state">
                <option value="Casado(a)">Casado(a)</option>
                <option value="Solteiro(a)">Solteiro(a)</option>
                <option value="Divorciado(a)">Divorciado(a)</option>
                <option value="Viúvo(a)">Viúvo(a)</option>
            </select>
            <br>
            <label for="civil-state">Escolaridade:</label>
        </fieldset>
    </form>
</body>
</html>
